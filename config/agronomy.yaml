# Agronomy constants for the Sensor-to-Dose Advisor (tomato). Code reads every value from here.
# Each constant names its source (FAO-56, Saxton & Rawls, crop_requirements.json) or is tagged
# "ASSUMPTION - verify vs TNAU/ICAR".

npk_unit: kg_ha   # N/P/K readings are compared directly with stage fertilizer requirements (kg/ha).

# Location (default Tiruchirappalli, Tamil Nadu)
default_lat: 10.79   # ASSUMPTION - verify vs TNAU/ICAR
default_lon: 78.70   # ASSUMPTION - verify vs TNAU/ICAR

# Sampling / quality (interval-aware; median interval derived from data at runtime)
flatline_consecutive: 3   # ASSUMPTION - verify vs TNAU/ICAR (applies to moisture, temperature, humidity only)
gap_max_multiplier: 2.0   # ASSUMPTION - verify vs TNAU/ICAR (GAP if missing > 2x median interval)
spike_min_points: 6       # ASSUMPTION - verify vs TNAU/ICAR (SPIKE only when >= 6 points)
spike_mad_factor: 4.0     # ASSUMPTION - verify vs TNAU/ICAR (|x - rolling median| > 4*MAD)
moisture_min: 0.0         # ASSUMPTION - verify vs TNAU/ICAR
moisture_max: 100.0       # ASSUMPTION - verify vs TNAU/ICAR
ph_min: 3.0               # ASSUMPTION - verify vs TNAU/ICAR
ph_max: 10.0              # ASSUMPTION - verify vs TNAU/ICAR
temp_min: -5.0            # ASSUMPTION - verify vs TNAU/ICAR
temp_max: 60.0            # ASSUMPTION - verify vs TNAU/ICAR

# Moisture thresholds (FAO-56 soil water balance, Allen et al. 1998, ch. 8)
# Telemetry moisture is volumetric water content (%). Irrigate when the crop has used a fraction p
# (per crop, see `crops` below) of the water held between field capacity and wilting point:
#   trigger = FC - p * (FC - PWP)        (FAO-56 eq. 82-83: TAW = FC - PWP, RAW = p * TAW)
# Irrigation refills the root zone back to FC. Flooded rice uses its own rule (see `crops.rice`).
#
# Not used: the Mendeley tomato dataset's 50% pump trigger (data/tomato_water_sensor_data.json,
# minTomatoMoisture; pump ON <= 49.98, OFF >= 51.22). That is a normalized capacitive-sensor reading
# (raw moistureValue ~614), not volumetric water content, so it does not apply to soil_telemetry.csv.
default_soil: clay_loam      # ASSUMPTION - sample data starts at 31% (just below clay-loam FC 32%), consistent with a freshly irrigated clay loam
soil_types:                  # volumetric water content, %
  clay_loam:
    fc: 32     # Saxton & Rawls (2006): clay loam FC 0.32 m3/m3
    pwp: 15    # Saxton & Rawls (2006): clay loam WP 0.15 m3/m3
  red_soil:
    fc: 26     # ASSUMPTION - TN red soils FC 16-19% gravimetric (Malavath & Mani 2018) x bulk density ~1.5
    pwp: 10    # ASSUMPTION - TN red soils WP 5-8% gravimetric (Malavath & Mani 2018) x bulk density ~1.5
  sandy_loam:
    fc: 14     # Saxton & Rawls (2006): sandy loam FC 0.14 m3/m3
    pwp: 5     # Saxton & Rawls (2006): sandy loam WP 0.05 m3/m3

# Crops
# p = FAO-56 Table 22 depletion fraction (at ETc ~5 mm/day): trigger = FC - p * (FC - PWP).
# N/P/K targets are fertilizer requirements in kg/ha, copied from data/crop_requirements.json
# (TNAU Agritech Portal & ICAR). Crops without stage data use one whole-season target.
# Stage max_days = upper bound of days after transplanting/sowing (inclusive) - ASSUMPTION, verify vs TNAU.
default_crop: tomato
crops:
  tomato:
    p: 0.40                  # FAO-56 Table 22: tomato
    stages:
      seedling:   {max_days: 20,   N: 40,  P: 50, K: 30}
      vegetative: {max_days: 45,   N: 75,  P: 40, K: 50}
      flowering:  {max_days: 70,   N: 100, P: 50, K: 60}
      fruiting:   {max_days: 9999, N: 120, P: 60, K: 75}
  maize:
    p: 0.55                  # FAO-56 Table 22: maize, field (grain)
    targets: {N: 120, P: 60, K: 50}
  cotton:
    p: 0.65                  # FAO-56 Table 22: cotton
    targets: {N: 80, P: 40, K: 40}
  rice:
    # Lowland rice is kept ponded, so the dry-down trigger does not apply (FAO-56 gives rice p = 0.20
    # of saturation). TNAU: irrigate to 5 cm depth once the ponded water has disappeared. Ponded water
    # gone is approximated as soil moisture below field capacity - ASSUMPTION.
    flooded: true
    flood_depth_mm: 50       # TNAU Agritech: irrigate to 5 cm depth
    stages:
      seedling:  {max_days: 15,   N: 40,  P: 40, K: 30}
      tillering: {max_days: 45,   N: 80,  P: 40, K: 40}
      flowering: {max_days: 85,   N: 100, P: 50, K: 50}
      ripening:  {max_days: 9999, N: 60,  P: 30, K: 40}

# Per-nutrient use efficiency (ASSUMPTION-tagged; N/P/K differ)
use_eff_N: 0.60   # ASSUMPTION - verify vs TNAU/ICAR (nitrogen use efficiency)
use_eff_P: 0.50   # ASSUMPTION - verify vs TNAU/ICAR (phosphorus use efficiency)
use_eff_K: 0.70   # ASSUMPTION - verify vs TNAU/ICAR (potassium use efficiency)

# Fertilizer products
urea_pct: 0.46            # ASSUMPTION - verify vs TNAU/ICAR (urea = 46% N)
dap_n_pct: 0.18           # ASSUMPTION - verify vs TNAU/ICAR (DAP = 18% N)
dap_p2o5_pct: 0.46        # ASSUMPTION - verify vs TNAU/ICAR (DAP = 46% P2O5)
mop_k2o_pct: 0.60         # ASSUMPTION - verify vs TNAU/ICAR (MOP = 60% K2O)
p_to_p2o5: 2.29           # ASSUMPTION - verify vs TNAU/ICAR (elemental P * 2.29 = P2O5)
k_to_k2o: 1.20            # ASSUMPTION - verify vs TNAU/ICAR (elemental K * 1.20 = K2O)

# Irrigation
max_daily_mm: 8           # ASSUMPTION - verify vs TNAU/ICAR (tomato ~8 mm/day max; keeps normal day 10k-40k L/acre)
root_depth_mm: 300        # ASSUMPTION - verify vs TNAU/ICAR (effective drip root zone; FAO-56 max is 0.7-1.5 m)
efficiency_drip: 0.90     # ASSUMPTION - verify vs TNAU/ICAR
efficiency_flood: 0.60    # ASSUMPTION - verify vs TNAU/ICAR
max_event_mm_drip: 5      # ASSUMPTION - verify vs TNAU/ICAR (max drip irrigation mm per event)
max_event_mm_flood: 25    # ASSUMPTION - verify vs TNAU/ICAR (max flood irrigation mm per event)

# Confidence deductions
deduct_flatline: 0.35     # ASSUMPTION - verify vs TNAU/ICAR
deduct_gap: 0.10          # ASSUMPTION - verify vs TNAU/ICAR
deduct_spike: 0.05        # ASSUMPTION - verify vs TNAU/ICAR
deduct_weather_fallback: 0.15 # ASSUMPTION - verify vs TNAU/ICAR
deduct_missing_npk: 0.20  # ASSUMPTION - verify vs TNAU/ICAR
deduct_lt5_days: 0.15     # ASSUMPTION - verify vs TNAU/ICAR
sensor_fault_confidence_cap: 0.40 # ASSUMPTION - verify vs TNAU/ICAR (rule R5)
confidence_high: 0.70     # ASSUMPTION - verify vs TNAU/ICAR
confidence_medium: 0.40   # ASSUMPTION - verify vs TNAU/ICAR

# Weather rules
eff_rain_factor: 0.8      # ASSUMPTION - verify vs TNAU/ICAR (effective rain = 0.8 * rain_mm if prob >= 60)
rain_skip_threshold_mm: 8   # ASSUMPTION - verify vs TNAU/ICAR
rain_skip_prob_pct: 60      # ASSUMPTION - verify vs TNAU/ICAR
rain_delay_threshold_mm: 25 # ASSUMPTION - verify vs TNAU/ICAR (delay fertilizer if rain >= 25mm)
heat_threshold_c: 35        # ASSUMPTION - verify vs TNAU/ICAR (tmax_next3 >= 35 -> dawn irrigation)
